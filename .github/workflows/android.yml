
name: Build 穿衣助手 APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find and extract Android project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -type f -iname "*.zip" -not -path "./.git/*" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "错误：没有找到 ZIP 文件"
            exit 1
          fi

          echo "找到 ZIP：$ZIP_FILE"

          mkdir -p android-project
          unzip -o "$ZIP_FILE" -d android-project

          SETTINGS_FILE=$(find android-project -name settings.gradle -type f -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "错误：没有找到 settings.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "错误：没有找到 app/build.gradle"
            exit 1
          fi

          echo "项目目录：$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and upload APK
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find android-project -name settings.gradle -type f -print -quit)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          gradle -p "$PROJECT_DIR" assembleDebug

          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name "*.apk" -type f -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "错误：没有生成 APK"
            exit 1
          fi

          echo "找到 APK：$APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 穿衣助手-APK
          path: android-project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
