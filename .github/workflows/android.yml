
name: Build 穿衣助手 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          mkdir -p android-project
          unzip -o clothing-assistant-source.zip -d android-project
          test -f android-project/settings.gradle
          test -f android-project/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 穿衣助手-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
